<!DOCTYPE html>
<html>
<head>
  <title>Coach Dashboard</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
    .dashboard-card { background: #f5f5f5; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
    .crisis-alert { background: #ffebee; border-color: #f44336; }
    .crisis-high { background: #fff3e0; border-color: #ff9800; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
    .stat-card { background: white; padding: 15px; border-radius: 6px; text-align: center; border: 1px solid #eee; }
    .client-list { max-height: 300px; overflow-y: auto; }
    .client-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: between; }
    .crisis-item { padding: 10px; border-bottom: 1px solid #eee; margin: 5px 0; }
    .severity-5 { border-left: 4px solid #f44336; }
    .severity-4 { border-left: 4px solid #ff9800; }
    .severity-3 { border-left: 4px solid #ffc107; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
    .btn-primary { background: #2196f3; color: white; }
    .btn-success { background: #4caf50; color: white; }
    .btn-danger { background: #f44336; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Coach Dashboard</h1>
    
    <div class="stats-grid" id="analytics">
      <div class="stat-card">
        <h3 id="total-clients">0</h3>
        <p>Total Clients</p>
      </div>
      <div class="stat-card">
        <h3 id="active-crises">0</h3>
        <p>Active Crises</p>
      </div>
      <div class="stat-card">
        <h3 id="total-sessions">0</h3>
        <p>Total Sessions</p>
      </div>
      <div class="stat-card">
        <h3 id="conversion-rate">0%</h3>
        <p>Conversion Rate</p>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="dashboard-card crisis-alert">
        <h2>Crisis Events</h2>
        <div id="crisis-events" class="client-list">
          <p>Loading crisis events...</p>
        </div>
      </div>

      <div class="dashboard-card">
        <h2>Recent Sessions</h2>
        <div id="recent-sessions" class="client-list">
          <p>Loading sessions...</p>
        </div>
      </div>

      <div class="dashboard-card">
        <h2>Client List</h2>
        <div id="client-list" class="client-list">
          <p>Loading clients...</p>
        </div>
      </div>

      <div class="dashboard-card">
        <h2>Quick Actions</h2>
        <button class="btn btn-primary" onclick="refreshData()">Refresh Data</button>
        <button class="btn btn-success" onclick="exportData()">Export Report</button>
        <button class="btn btn-danger" onclick="viewAllCrises()">View All Crises</button>
      </div>
    </div>
  </div>

  <script>
    let authToken = localStorage.getItem('authToken');
    
    async function fetchWithAuth(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${authToken}`,
          ...options.headers
        }
      });
      return response;
    }

    async function loadAnalytics() {
      try {
        const response = await fetchWithAuth('/api/coach/analytics');
        const data = await response.json();
        
        document.getElementById('total-clients').textContent = data.total_clients;
        document.getElementById('active-crises').textContent = data.active_crises;
        document.getElementById('total-sessions').textContent = data.total_sessions;
        document.getElementById('conversion-rate').textContent = data.conversion_rate.toFixed(1) + '%';
      } catch (error) {
        console.error('Error loading analytics:', error);
      }
    }

    async function loadCrisisEvents() {
      try {
        const response = await fetchWithAuth('/api/coach/crisis-events');
        const events = await response.json();
        
        const container = document.getElementById('crisis-events');
        if (events.length === 0) {
          container.innerHTML = '<p>No active crisis events</p>';
          return;
        }
        
        container.innerHTML = events.map(event => `
          <div class="crisis-item severity-${event.severity}">
            <strong>User ${event.user_id}</strong> - Severity ${event.severity}
            <br><small>${new Date(event.created_at).toLocaleString()}</small>
            <br><em>${event.flags.slice(0, 2).join(', ')}</em>
            <br><button class="btn btn-success" onclick="resolveCrisis(${event.id})">Resolve</button>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading crisis events:', error);
      }
    }

    async function loadSessions() {
      try {
        const response = await fetchWithAuth('/api/coach/sessions');
        const sessions = await response.json();
        
        const container = document.getElementById('recent-sessions');
        if (sessions.length === 0) {
          container.innerHTML = '<p>No recent sessions</p>';
          return;
        }
        
        container.innerHTML = sessions.slice(0, 10).map(session => `
          <div class="client-item">
            <div>
              <strong>User ${session.user_id}</strong> - ${session.tier}
              <br><small>${new Date(session.created_at).toLocaleString()}</small>
              <br><span style="color: ${session.payment_status === 'completed' ? 'green' : 'orange'}">${session.payment_status}</span>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading sessions:', error);
      }
    }

    async function loadClients() {
      try {
        const response = await fetchWithAuth('/api/coach/clients');
        const clients = await response.json();
        
        const container = document.getElementById('client-list');
        if (clients.length === 0) {
          container.innerHTML = '<p>No clients found</p>';
          return;
        }
        
        container.innerHTML = clients.map(client => `
          <div class="client-item">
            <div>
              <strong>${client.email}</strong>
              <br><small>Joined: ${new Date(client.created_at).toLocaleDateString()}</small>
              <br><span style="color: ${client.is_active ? 'green' : 'red'}">${client.is_active ? 'Active' : 'Inactive'}</span>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading clients:', error);
      }
    }

    async function resolveCrisis(eventId) {
      try {
        const response = await fetchWithAuth(`/api/coach/crisis-events/${eventId}/resolve`, {
          method: 'POST'
        });
        
        if (response.ok) {
          alert('Crisis event resolved successfully');
          loadCrisisEvents();
          loadAnalytics();
        }
      } catch (error) {
        console.error('Error resolving crisis:', error);
      }
    }

    function refreshData() {
      loadAnalytics();
      loadCrisisEvents();
      loadSessions();
      loadClients();
    }

    function exportData() {
      alert('Export functionality would be implemented here');
    }

    function viewAllCrises() {
      window.location.href = '/admin/adminindex.html';
    }

    document.addEventListener('DOMContentLoaded', function() {
      refreshData();
      setInterval(refreshData, 30000);
    });
  </script>
</body>
</html>
