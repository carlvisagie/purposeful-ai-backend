<!DOCTYPE html>
<html>
<head>
  <title>Submit Your Session</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .form-container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group textarea, .form-group select { 
      width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; 
    }
    .form-group textarea { height: 120px; resize: vertical; }
    .btn { padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
    .btn-primary { background: #2196f3; color: white; }
    .btn-success { background: #4caf50; color: white; }
    .crisis-warning { background: #ffebee; border: 1px solid #f44336; padding: 15px; border-radius: 4px; margin: 20px 0; }
    .crisis-resources { background: #e3f2fd; border: 1px solid #2196f3; padding: 15px; border-radius: 4px; margin: 20px 0; }
    .results { background: #f5f5f5; padding: 20px; border-radius: 4px; margin: 20px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-container">
      <h1>Submit Your Session Summary</h1>
      <p>Please describe how you're feeling and what you'd like to work on:</p>
      
      <form id="session-form">
        <div class="form-group">
          <label for="email">Email (for account creation):</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label for="inputText">Current Experience & Goals:</label>
          <textarea id="inputText" name="text" placeholder="Type your current experience, struggles, or goals here..." required></textarea>
        </div>
        
        <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" min="13" max="120">
        </div>
        
        <div class="form-group">
          <label for="chronic">Chronic Conditions (comma-separated):</label>
          <input type="text" id="chronic" name="chronic" placeholder="e.g., diabetes, anxiety, depression">
        </div>
        
        <div class="form-group">
          <label for="habits">Current Habits (comma-separated):</label>
          <input type="text" id="habits" name="habits" placeholder="e.g., smoking, exercise, meditation">
        </div>
        
        <div class="form-group">
          <label for="emergency_contact">Emergency Contact:</label>
          <input type="text" id="emergency_contact" name="emergency_contact" placeholder="Name and phone number">
        </div>
        
        <div class="form-group">
          <label for="tier">Preferred Tier:</label>
          <select id="tier" name="tier">
            <option value="">Select a tier</option>
            <option value="Shift Session">Shift Session ($35)</option>
            <option value="Clarity+">Clarity+ ($75)</option>
            <option value="Mastery">Mastery ($195)</option>
          </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Run Diagnostic</button>
      </form>
      
      <div id="crisis-alert" class="crisis-warning hidden">
        <h3>⚠️ Crisis Detected</h3>
        <p>We've detected that you may be experiencing a crisis. Please reach out for immediate help:</p>
        <div id="crisis-resources"></div>
      </div>
      
      <div id="results" class="results hidden">
        <h2>Diagnostic Results</h2>
        <div id="results-content"></div>
        <div id="payment-section" class="hidden">
          <h3>Payment</h3>
          <p>Based on your diagnostic results, we recommend the <strong id="recommended-tier"></strong> tier.</p>
          <button id="proceed-payment" class="btn btn-success">Proceed to Payment</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentSessionId = null;
    let currentUserId = null;

    document.getElementById('session-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(e.target);
      const data = {
        email: formData.get('email'),
        text: formData.get('text'),
        age: parseInt(formData.get('age')) || 0,
        chronic: formData.get('chronic').split(',').map(s => s.trim()).filter(s => s),
        habits: formData.get('habits').split(',').map(s => s.trim()).filter(s => s),
        tier: formData.get('tier'),
        client_data: {
          emergency_contact: formData.get('emergency_contact')
        }
      };

      try {
        const userResponse = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: data.email,
            password: 'temp-password-' + Date.now(),
            role: 'client'
          })
        });
        
        if (userResponse.ok) {
          const userData = await userResponse.json();
          currentUserId = userData.user_id;
          data.user_id = currentUserId;
        }

        const diagnosticResponse = await fetch('/api/run_diagnostic', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        const results = await diagnosticResponse.json();
        currentSessionId = results.session_id;
        
        displayResults(results);
        
        if (results.crisis_analysis && results.crisis_analysis.severity >= 3) {
          showCrisisAlert(results.crisis_analysis);
        }
        
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred. Please try again.');
      }
    });

    function displayResults(results) {
      const resultsDiv = document.getElementById('results');
      const contentDiv = document.getElementById('results-content');
      
      let html = `
        <h3>Profile Analysis</h3>
        <ul>
      `;
      
      for (const [category, flags] of Object.entries(results.profile)) {
        if (flags.length > 0) {
          html += `<li><strong>${category}:</strong> ${flags.join(', ')}</li>`;
        }
      }
      
      html += `
        </ul>
        <h3>Risk Assessment</h3>
        <p><strong>Mortality Risk:</strong> ${results.mortality_risk}</p>
        <p><strong>Tier Mismatch:</strong> ${results.tier_mismatch ? 'Yes' : 'No'}</p>
      `;
      
      if (results.missing_info && results.missing_info.length > 0) {
        html += `<p><strong>Missing Information:</strong> ${results.missing_info.join(', ')}</p>`;
      }
      
      contentDiv.innerHTML = html;
      resultsDiv.classList.remove('hidden');
      
      const recommendedTier = getTierRecommendation(results.mortality_risk);
      document.getElementById('recommended-tier').textContent = recommendedTier;
      document.getElementById('payment-section').classList.remove('hidden');
    }

    function showCrisisAlert(crisisAnalysis) {
      const alertDiv = document.getElementById('crisis-alert');
      const resourcesDiv = document.getElementById('crisis-resources');
      
      let resourcesHtml = '';
      if (crisisAnalysis.crisis_resources) {
        for (const [key, value] of Object.entries(crisisAnalysis.crisis_resources)) {
          resourcesHtml += `<p><strong>${key}:</strong> ${value}</p>`;
        }
      }
      
      resourcesDiv.innerHTML = resourcesHtml;
      alertDiv.classList.remove('hidden');
    }

    function getTierRecommendation(riskLevel) {
      const riskMap = {
        "low": "Shift Session",
        "elevated": "Clarity+",
        "critical": "Mastery"
      };
      return riskMap[riskLevel] || "Shift Session";
    }

    document.getElementById('proceed-payment').addEventListener('click', async function() {
      const tier = document.getElementById('recommended-tier').textContent;
      
      try {
        const response = await fetch('/api/get_payment_link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tier: tier,
            session_id: currentSessionId
          })
        });
        
        const data = await response.json();
        if (data.payment_link) {
          window.open(data.payment_link, '_blank');
        }
      } catch (error) {
        console.error('Error getting payment link:', error);
      }
    });
  </script>
</body>
</html>
