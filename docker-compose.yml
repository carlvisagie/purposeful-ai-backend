version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: purposeful-db
    environment:
      POSTGRES_DB: purposeful
      POSTGRES_USER: purposeful
      POSTGRES_PASSWORD: purposeful_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purposeful"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: .
    container_name: purposeful-backend
    ports:
      - "5000:5000"
    environment:
      # Core
      SECRET_KEY: dev-secret-key-change-in-production
      JWT_SECRET_KEY: dev-jwt-secret-change-in-production
      DATABASE_URL: postgresql://purposeful:purposeful_dev_password@db:5432/purposeful
      FLASK_ENV: development
      
      # OpenAI (add your key)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Stripe (add your keys)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID_SHIFT_SESSION: ${STRIPE_PRICE_ID_SHIFT_SESSION}
      STRIPE_PRICE_ID_CLARITY_PLUS: ${STRIPE_PRICE_ID_CLARITY_PLUS}
      STRIPE_PRICE_ID_MASTERY: ${STRIPE_PRICE_ID_MASTERY}
      
      # Calendly (add your keys)
      CALENDLY_API_KEY: ${CALENDLY_API_KEY}
      CALENDLY_WEBHOOK_SIGNING_KEY: ${CALENDLY_WEBHOOK_SIGNING_KEY}
      
      # Zoom (add your keys)
      ZOOM_API_KEY: ${ZOOM_API_KEY}
      ZOOM_API_SECRET: ${ZOOM_API_SECRET}
      
      # Twilio/WhatsApp (add your keys)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      
      # Frontend URL
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        python backend/migrations/create_onboarding_tables.py &&
        gunicorn -w 4 -b 0.0.0.0:5000 --reload --timeout 120 --access-logfile - --error-logfile - backend.app:app
      "

  # Adminer (Database Management UI)
  adminer:
    image: adminer:latest
    container_name: purposeful-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  default:
    name: purposeful-network

